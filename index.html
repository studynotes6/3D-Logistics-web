<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Scroll Website Example</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }
    section {
      height: 100vh;
      display: flex;
      align-items: center;
      padding: 0 10%;
      position: relative;
      z-index: 2;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      max-width: 400px;
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GLTF Loader for 3D Models -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- GSAP & ScrollTrigger for Scroll Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <section>
    <div class="card">
      <h1>Logistics & Transport</h1>
      <p>Scroll karke 3D animation dekhein.</p>
    </div>
  </section>

  <section style="justify-content: flex-end;">
    <div class="card">
      <h2>Reliability At Every Step</h2>
      <p>Aapke scroll karte hi 3D model ki position aur angle change honge.</p>
    </div>
  </section>

  <script>
    // 1. Scene & Camera Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('webgl-canvas'),
      alpha: true,
      antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Light
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(2, 5, 3);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // Sample 3D Container (Cube placeholder)
    const geometry = new THREE.BoxGeometry(2, 1, 1);
    const material = new THREE.MeshStandardMaterial({ color: 0xff3300 });
    const model = new THREE.Mesh(geometry, material);
    scene.add(model);

    // 2. GSAP ScrollTrigger Animation
    gsap.registerPlugin(ScrollTrigger);

    // Scroll par object rotate aur shift hoga
    gsap.to(model.rotation, {
      y: Math.PI * 2,
      x: 0.5,
      scrollTrigger: {
        trigger: "body",
        start: "top top",
        end: "bottom bottom",
        scrub: 1
      }
    });

    gsap.to(model.position, {
      x: -2,
      scrollTrigger: {
        trigger: "body",
        start: "top top",
        end: "bottom bottom",
        scrub: 1
      }
    });

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
